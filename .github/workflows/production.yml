name: Carmack Coder Production Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Target repository URL to transform'
        required: true
        type: string
      branch:
        description: 'Target branch'
        required: false
        default: 'main'
        type: string
      risk_level:
        description: 'Risk level filter'
        required: false
        default: 'low'
        type: choice
        options:
          - low
          - medium
          - high
      dry_run:
        description: 'Dry run mode'
        required: false
        default: true
        type: boolean

env:
  BUN_VERSION: '1.2.18'
  NODE_ENV: production

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run type-check

      - name: Run tests
        run: bun test

      - name: Verify Dafny proofs
        run: |
          sudo apt-get update
          sudo apt-get install -y dafny
          bun run verify

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    environment: 
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy via Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d
          
      - name: Wait for service to be ready
        run: |
          for i in {1..30}; do
            if docker-compose ps | grep -q "carmack-production.*Up"; then
              echo "Service is ready"
              break
            fi
            echo "Waiting for service... ($i/30)"
            sleep 10
          done

      - name: Run health check
        run: |
          docker-compose exec -T carmack-coder bun run production.ts --help

  transform-repository:
    name: Transform Repository
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Git credentials
        run: |
          git config --global user.name "Carmack Coder Bot"
          git config --global user.email "carmack-coder@github.com"

      - name: Run transformation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run production.ts \
            --repository "${{ github.event.inputs.target_repository }}" \
            --branch "${{ github.event.inputs.branch }}" \
            --risk-level "${{ github.event.inputs.risk_level }}" \
            $(if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then echo "--dry-run"; fi) \
            --verbose \
            --auto-commit

      - name: Create transformation report
        if: always()
        run: |
          echo "# Carmack Coder Transformation Report" > transformation-report.md
          echo "" >> transformation-report.md
          echo "- **Repository**: ${{ github.event.inputs.target_repository }}" >> transformation-report.md
          echo "- **Branch**: ${{ github.event.inputs.branch }}" >> transformation-report.md
          echo "- **Risk Level**: ${{ github.event.inputs.risk_level }}" >> transformation-report.md
          echo "- **Dry Run**: ${{ github.event.inputs.dry_run }}" >> transformation-report.md
          echo "- **Status**: $(if [ $? -eq 0 ]; then echo "✅ Success"; else echo "❌ Failed"; fi)" >> transformation-report.md
          echo "- **Timestamp**: $(date)" >> transformation-report.md

      - name: Upload transformation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformation-report
          path: transformation-report.md

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test repository
        run: |
          mkdir -p /tmp/test-repo
          cd /tmp/test-repo
          git init
          
          # Create test files with various patterns
          for i in {1..10}; do
            cat << EOF > test-file-$i.ts
          var oldStyle = "should be const";
          function legacy() {
            if (items.indexOf(target) != -1) {
              return "found: " + target + " in list";
            }
          }
          EOF
          done
          
          git add .
          git commit -m "Initial test files"

      - name: Run performance test
        run: |
          time bun run production.ts \
            --workspace /tmp/test-repo \
            --dry-run \
            --verbose \
            --max-files 10

      - name: Benchmark results
        run: |
          echo "Performance test completed"
          du -sh /tmp/test-repo
