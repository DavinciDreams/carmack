version: '3.8'

services:
  # PostgreSQL with pgvector for knowledge graph storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carmack-postgres
    environment:
      POSTGRES_DB: tensorrt_knowledge_graph
      POSTGRES_USER: carmack
      POSTGRES_PASSWORD: carmack_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/indices.sql:/docker-entrypoint-initdb.d/02-indices.sql:ro
    networks:
      - carmack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmack -d tensorrt_knowledge_graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmack-api
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CARMACK_WORKSPACE=/workspace
      - CARMACK_LOG_LEVEL=info
      - CARMACK_TELEMETRY_ENABLED=true
      - POSTGRES_URL=postgresql://carmack:carmack_password@postgres:5432/tensorrt_knowledge_graph
      - GITHUB_TOKEN=ghp_xxx...
    volumes:
      - carmack-workspace:/workspace
      - ./production.config.ts:/app/production.config.ts:ro
    networks:
      - carmack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bun", "run", "production.ts"]
    command: []
  # Ingestion service
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmack-ingestion
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CARMACK_WORKSPACE=/workspace
      - CARMACK_LOG_LEVEL=info
      - CARMACK_TELEMETRY_ENABLED=true
      - POSTGRES_URL=postgresql://carmack:carmack_password@postgres:5432/tensorrt_knowledge_graph
      - GITHUB_TOKEN=ghp_xxx...
    volumes:
      - carmack-workspace:/workspace
      - ./production.config.ts:/app/production.config.ts:ro
    networks:
      - carmack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bun", "run", "production.ts"]
    command: []
  # Learning service
  learning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmack-learning
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CARMACK_WORKSPACE=/workspace
      - CARMACK_LOG_LEVEL=info
      - CARMACK_TELEMETRY_ENABLED=true
      - POSTGRES_URL=postgresql://carmack:carmack_password@postgres:5432/tensorrt_knowledge_graph
      - GITHUB_TOKEN=ghp_xxx...
    volumes:
      - carmack-workspace:/workspace
      - ./production.config.ts:/app/production.config.ts:ro
    networks:
      - carmack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bun", "run", "production.ts"]
    command: []
  # Telemetry service
  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmack-telemetry
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CARMACK_WORKSPACE=/workspace
      - CARMACK_LOG_LEVEL=info
      - CARMACK_TELEMETRY_ENABLED=true
      - POSTGRES_URL=postgresql://carmack:carmack_password@postgres:5432/tensorrt_knowledge_graph
      - GITHUB_TOKEN=ghp_xxx...
    volumes:
      - carmack-workspace:/workspace
      - ./production.config.ts:/app/production.config.ts:ro
    networks:
      - carmack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bun", "run", "production.ts"]
    command: []
  # Monitoring (Grafana)
  carmack-monitor:
    image: grafana/grafana:latest
    container_name: carmack-monitor
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=carmack123
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - carmack-network
    restart: unless-stopped

  # Metrics (Prometheus)
  carmack-metrics:
    image: prom/prometheus:latest
    container_name: carmack-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - carmack-network
    restart: unless-stopped

networks:
  carmack-network:
    driver: bridge

volumes:
  carmack-workspace:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
