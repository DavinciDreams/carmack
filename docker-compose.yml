version: '3.8'

services:
  # PostgreSQL with pgvector for knowledge graph storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carmack-postgres
    environment:
      POSTGRES_DB: tensorrt_knowledge_graph
      POSTGRES_USER: carmack
      POSTGRES_PASSWORD: carmack_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/indices.sql:/docker-entrypoint-initdb.d/02-indices.sql:ro
    networks:
      - carmack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmack -d tensorrt_knowledge_graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  carmack-coder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmack-production
    environment:
      - NODE_ENV=production
      - CARMACK_WORKSPACE=/workspace
      - CARMACK_LOG_LEVEL=info
      - CARMACK_TELEMETRY_ENABLED=true
      - POSTGRES_URL=postgresql://carmack:carmack_password@postgres:5432/tensorrt_knowledge_graph
    volumes:
      # Mount workspace for persistent storage
      - carmack-workspace:/workspace
      # Mount git credentials if needed
      - ${HOME}/.gitconfig:/home/carmack/.gitconfig:ro
      - ${HOME}/.ssh:/home/carmack/.ssh:ro
      # Mount custom configuration
      - ./production.config.ts:/app/production.config.ts:ro
    networks:
      - carmack-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --repository https://github.com/your-org/your-repo.git
      --branch main
      --auto-commit
      --risk-level low
      --verbose

  carmack-monitor:
    image: grafana/grafana:latest
    container_name: carmack-monitor
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=carmack123
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - carmack-network
    restart: unless-stopped

  carmack-metrics:
    image: prom/prometheus:latest
    container_name: carmack-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - carmack-network
    restart: unless-stopped

networks:
  carmack-network:
    driver: bridge

volumes:
  carmack-workspace:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
