global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "carmack_alerts.yml"
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'carmack-coder'
    static_configs:
      - targets: ['carmack-coder:3001']
    scrape_interval: 10s
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093
