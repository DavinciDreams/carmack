version: '3.8'

services:
  # PostgreSQL with pgvector for TensorRT Oracle knowledge graph
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tensorrt-postgres
    environment:
      POSTGRES_DB: tensorrt_knowledge_graph
      POSTGRES_USER: tensorrt_oracle
      POSTGRES_PASSWORD: oracle_secure_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - tensorrt-postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/indices.sql:/docker-entrypoint-initdb.d/02-indices.sql:ro
      - ./sql/migrations/001_tensorrt_knowledge_graph_schema.sql:/docker-entrypoint-initdb.d/03-enhanced-schema.sql:ro
      - ./sql/migrations/002_add_compatibility_tables.sql:/docker-entrypoint-initdb.d/04-compatibility.sql:ro
    networks:
      - tensorrt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tensorrt_oracle -d tensorrt_knowledge_graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TensorRT Oracle Application
  tensorrt-oracle:
    build:
      context: .
      dockerfile: Dockerfile.tensorrt
    container_name: tensorrt-oracle-app
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://tensorrt_oracle:oracle_secure_password@postgres:5432/tensorrt_knowledge_graph
      - TENSORRT_WORKSPACE=/workspace
      - TENSORRT_LOG_LEVEL=info
      - TENSORRT_TELEMETRY_ENABLED=true
      - CARMACK_REPOSITORY_URL=https://github.com/NVIDIA/TensorRT-LLM.git
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    ports:
      - "8080:8080"  # API server
      - "8081:8081"  # Demo interface
    volumes:
      - tensorrt-workspace:/workspace
      - tensorrt-repositories:/repositories
      - ./logs:/app/logs
    networks:
      - tensorrt-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "src/ultra-minimal-server.ts"]

  # TensorRT Oracle Demo Interface (Interactive)
  tensorrt-demo:
    build:
      context: .
      dockerfile: Dockerfile.tensorrt
    container_name: tensorrt-demo-interface
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://tensorrt_oracle:oracle_secure_password@postgres:5432/tensorrt_knowledge_graph
      - CARMACK_REPOSITORY_URL=https://github.com/NVIDIA/TensorRT-LLM.git
      - TENSORRT_DEMO_MODE=interactive
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    volumes:
      - tensorrt-workspace:/workspace
      - ./logs:/app/logs
    networks:
      - tensorrt-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "demo/tensorrt-demo.ts"]
    stdin_open: true
    tty: true

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: tensorrt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-tensorrt.yml:/etc/prometheus/prometheus.yml:ro
      - tensorrt-prometheus-data:/prometheus
    networks:
      - tensorrt-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana for monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: tensorrt-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=tensorrt_oracle_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - tensorrt-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - tensorrt-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: tensorrt-redis
    ports:
      - "6379:6379"
    volumes:
      - tensorrt-redis-data:/data
    networks:
      - tensorrt-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy for production deployment
  nginx:
    image: nginx:alpine
    container_name: tensorrt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tensorrt-oracle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - tensorrt-network
    restart: unless-stopped
    depends_on:
      - tensorrt-oracle
      - grafana

networks:
  tensorrt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  tensorrt-postgres-data:
    driver: local
  tensorrt-workspace:
    driver: local
  tensorrt-repositories:
    driver: local
  tensorrt-prometheus-data:
    driver: local
  tensorrt-grafana-data:
    driver: local
  tensorrt-redis-data:
    driver: local